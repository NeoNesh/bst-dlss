plugins {
    id 'java'
}

group = 'dev.bstdlss'
version = '1.1.0'

repositories {
    mavenCentral()
}

sourceSets {
    apiStubs {
        java {
            srcDirs = ['src/compileOnly/java']
        }
    }
    main {
        compileClasspath += sourceSets.apiStubs.output
    }
}

dependencies {
    compileOnly 'org.lwjgl:lwjgl:3.3.1'
    compileOnly 'org.lwjgl:lwjgl-opengl:3.3.1'
    compileOnly 'org.lwjgl:lwjgl-glfw:3.3.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.lwjgl:lwjgl:3.3.1'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveBaseName.set('bst-dlss-forge')
    archiveVersion.set('1.1.0-mc1.18.2-26.3')

    manifest {
        attributes([
            'Specification-Title'     : 'bstdlss',
            'Specification-Vendor'    : 'BST Team',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'BST Team'
        ])
    }
}
